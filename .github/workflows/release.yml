name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Verify release candidate
        run: |
          go vet ./...
          go test -race ./...

      - name: Cross-compile static binaries
        run: |
          make cross VERSION="${GITHUB_REF_NAME}"
          cd dist && sha256sum mailpilot-* > SHA256SUMS.txt && ls -lh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mailpilot-linux-amd64 \
            dist/mailpilot-linux-arm64 \
            dist/mailpilot-darwin-arm64 \
            dist/mailpilot-darwin-amd64 \
            dist/SHA256SUMS.txt \
            --title "mailpilot ${GITHUB_REF_NAME}" \
            --generate-notes
