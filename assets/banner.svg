<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="t">mailpilot</title>
  <desc id="d">A new email arrives over IMAP IDLE, mailpilot analyzes it with an LLM (codex, OpenAI-compatible, or Ollama), and pushes a structured summary to your phone in seconds.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9ff"/>
      <stop offset="52%" stop-color="#eef1fe"/>
      <stop offset="100%" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardSh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.34"/>
    </filter>

    <!-- send / paper-plane glyph (24x24) -->
    <path id="send" d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
    <!-- flow pipes -->
    <path id="p1" d="M330 250 C 410 250 470 232 548 232"/>
    <path id="p2" d="M732 232 C 812 232 872 250 950 250"/>
  </defs>

  <style>
    .h1   { fill:#1e1b4b; font-size:31px; font-weight:800; letter-spacing:-0.02em; }
    .sub  { fill:#64748b; font-size:13.5px; font-weight:500; }
    .sect { fill:#6366f1; font-size:11px; font-weight:700; letter-spacing:0.22em; }
    .cardT{ fill:#1e293b; font-size:16px; font-weight:650; }
    .cardS{ fill:#94a3b8; font-size:12px; font-weight:500; }
    .chip { fill:#475569; font-size:11.5px; font-weight:600; }
    .foot { fill:#7c8aa3; font-size:12.5px; font-weight:500; }
    .footA{ fill:#4f46e5; font-size:12.5px; font-weight:700; }
    .card { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; }
    .pipe { fill:none; stroke:url(#pipe); stroke-width:2.4; stroke-linecap:round; stroke-dasharray:5 9; animation:flow 2.3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-140; } }
    @media (prefers-reduced-motion: reduce){ .pipe{ animation:none } }
  </style>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <ellipse cx="640" cy="250" rx="520" ry="200" fill="url(#halo)"/>

  <!-- brand header -->
  <g transform="translate(64 40)">
    <rect width="46" height="46" rx="12" fill="url(#tile)"/>
    <use href="#send" transform="translate(11 11) scale(1)" fill="#ffffff"/>
  </g>
  <text x="124" y="60" class="h1">mailpilot</text>
  <text x="124" y="82" class="sub">Push-style AI email assistant · one static Go binary · real-time IMAP IDLE</text>

  <!-- section labels -->
  <text x="84"  y="166" class="sect">INBOX</text>
  <text x="640" y="166" class="sect" text-anchor="middle">MAILPILOT ENGINE</text>
  <text x="1196" y="166" class="sect" text-anchor="end">YOUR PHONE</text>

  <!-- ░░ flow pipes ░░ -->
  <use href="#p1" class="pipe"/>
  <use href="#p2" class="pipe"/>

  <!-- ░░ INBOX card ░░ -->
  <g filter="url(#cardSh)">
    <rect class="card" x="72" y="186" width="256" height="128" rx="16"/>
  </g>
  <g transform="translate(98 218) scale(1.7)" fill="#EA4335">
    <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
  </g>
  <text x="150" y="232" class="cardT">New mail</text>
  <text x="150" y="254" class="cardS">IMAP IDLE · seconds</text>
  <!-- live heartbeat -->
  <circle cx="306" cy="206" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ░░ ENGINE node ░░ -->
  <circle cx="640" cy="232" r="52" fill="#6366f1" opacity="0.16">
    <animate attributeName="r" values="50;70;50" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0;0.22" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#glow)">
    <rect x="596" y="188" width="88" height="88" rx="22" fill="url(#tile)"/>
  </g>
  <use href="#send" transform="translate(617 209) scale(1.95)" fill="#ffffff"/>

  <!-- provider chips under engine -->
  <g transform="translate(548 300)">
    <rect width="184" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <g transform="translate(16 7) scale(0.66)" fill="#111827"><path d="M9.205 8.658v-2.26c0-.19.072-.333.238-.428l4.543-2.616c.619-.357 1.356-.523 2.117-.523 2.854 0 4.662 2.212 4.662 4.566 0 .167 0 .357-.024.547l-4.71-2.759a.797.797 0 00-.856 0l-5.97 3.473zm10.609 8.8V12.06c0-.333-.143-.57-.429-.737l-5.97-3.473 1.95-1.118a.433.433 0 01.476 0l4.543 2.617c1.309.76 2.189 2.378 2.189 3.948 0 1.808-1.07 3.473-2.76 4.163zM7.802 12.703l-1.95-1.142c-.167-.095-.239-.238-.239-.428V5.899c0-2.545 1.95-4.472 4.591-4.472 1 0 1.927.333 2.712.928L8.23 5.067c-.285.166-.428.404-.428.737v6.898zM12 15.128l-2.795-1.57v-3.33L12 8.658l2.795 1.57v3.33L12 15.128zm1.796 7.23c-1 0-1.927-.332-2.712-.927l4.686-2.712c.285-.166.428-.404.428-.737v-6.898l1.974 1.142c.167.095.238.238.238.428v5.233c0 2.545-1.974 4.472-4.614 4.472zm-5.637-5.303l-4.544-2.617c-1.308-.761-2.188-2.378-2.188-3.948A4.482 4.482 0 014.21 6.327v5.423c0 .333.143.571.428.738l5.947 3.449-1.95 1.118a.432.432 0 01-.476 0zm-.262 3.9c-2.688 0-4.662-2.021-4.662-4.519 0-.19.024-.38.047-.57l4.686 2.71c.286.167.571.167.856 0l5.97-3.448v2.26c0 .19-.07.333-.237.428l-4.543 2.616c-.619.357-1.356.523-2.117.523zm5.899 2.83a5.947 5.947 0 005.827-4.756C22.287 18.339 24 15.84 24 13.296c0-1.665-.713-3.282-1.998-4.448.119-.5.19-.999.19-1.498 0-3.401-2.759-5.947-5.946-5.947-.642 0-1.26.095-1.88.31A5.962 5.962 0 0010.205 0a5.947 5.947 0 00-5.827 4.757C1.713 5.447 0 7.945 0 10.49c0 1.666.713 3.283 1.998 4.448-.119.5-.19 1-.19 1.499 0 3.401 2.759 5.946 5.946 5.946.642 0 1.26-.095 1.88-.309a5.96 5.96 0 004.162 1.713z"/></g>
    <text x="34" y="20" class="chip">codex · openai</text>
    <g transform="translate(150 6) scale(0.75)" fill="#111827"><path d="M7.905 1.09c.216.085.411.225.588.41.295.306.544.744.734 1.263.191.522.315 1.1.362 1.68a5.054 5.054 0 012.049-.636l.051-.004c.87-.07 1.73.087 2.48.474.101.053.2.11.297.17.05-.569.172-1.134.36-1.644.19-.52.439-.957.733-1.264a1.67 1.67 0 01.589-.41c.257-.1.53-.118.796-.042.401.114.745.368 1.016.737.248.337.434.769.561 1.287.23.934.27 2.163.115 3.645l.053.04.026.019c.757.576 1.284 1.397 1.563 2.35.435 1.487.216 3.155-.534 4.088l-.018.021.002.003c.417.762.67 1.567.724 2.4l.002.03c.064 1.065-.2 2.137-.814 3.19l-.007.01.01.024c.472 1.157.62 2.322.438 3.486l-.006.039a.651.651 0 01-.747.536.648.648 0 01-.54-.742c.167-1.033.01-2.069-.48-3.123a.643.643 0 01.04-.617l.004-.006c.604-.924.854-1.83.8-2.72-.046-.779-.325-1.544-.8-2.273a.644.644 0 01.18-.886l.009-.006c.243-.159.467-.565.58-1.12a4.229 4.229 0 00-.095-1.974c-.205-.7-.58-1.284-1.105-1.683-.595-.454-1.383-.673-2.38-.61a.653.653 0 01-.632-.371c-.314-.665-.772-1.141-1.343-1.436a3.288 3.288 0 00-1.772-.332c-1.245.099-2.343.801-2.67 1.686a.652.652 0 01-.61.425c-1.067.002-1.893.252-2.497.703-.522.39-.878.935-1.066 1.588a4.07 4.07 0 00-.068 1.886c.112.558.331 1.02.582 1.269l.008.007c.212.207.257.53.109.785-.36.622-.629 1.549-.673 2.44-.05 1.018.186 1.902.719 2.536l.016.019a.643.643 0 01.095.69c-.576 1.236-.753 2.252-.562 3.052a.652.652 0 01-1.269.298c-.243-1.018-.078-2.184.473-3.498l.014-.035-.008-.012a4.339 4.339 0 01-.598-1.309l-.005-.019a5.764 5.764 0 01-.177-1.785c.044-.91.278-1.842.622-2.59l.012-.026-.002-.002c-.293-.418-.51-.953-.63-1.545l-.005-.024a5.352 5.352 0 01.093-2.49c.262-.915.777-1.701 1.536-2.269.06-.045.123-.09.186-.132-.159-1.493-.119-2.73.112-3.67.127-.518.314-.95.562-1.287.27-.368.614-.622 1.015-.737.266-.076.54-.059.797.042zm4.116 9.09c.936 0 1.8.313 2.446.855.63.527 1.005 1.235 1.005 1.94 0 .888-.406 1.58-1.133 2.022-.62.375-1.451.557-2.403.557-1.009 0-1.871-.259-2.493-.734-.617-.47-.963-1.13-.963-1.845 0-.707.398-1.417 1.056-1.946.668-.537 1.55-.849 2.485-.849zm.662 1.21l.004.004c.12.151.095.37-.056.49l-.292.23v.446a.375.375 0 01-.376.373.375.375 0 01-.376-.373v-.46l-.271-.218a.347.347 0 01-.052-.49.353.353 0 01.494-.051l.215.172.22-.174a.353.353 0 01.49.051zm-5.04-1.919c.478 0 .867.39.867.871a.87.87 0 01-.868.871.87.87 0 01-.867-.87.87.87 0 01.867-.872zm8.706 0c.48 0 .868.39.868.871a.87.87 0 01-.868.871.87.87 0 01-.867-.87.87.87 0 01.867-.872z"/></g>
    <text x="168" y="20" class="chip">ollama</text>
  </g>

  <!-- ░░ PHONE / push card ░░ -->
  <g filter="url(#cardSh)">
    <rect class="card" x="952" y="186" width="256" height="128" rx="16"/>
  </g>
  <!-- notification card -->
  <rect x="972" y="204" width="216" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="972" y="204" width="4" height="92" rx="2" fill="url(#tile)"/>
  <rect x="988" y="218" width="52" height="20" rx="10" fill="#eef2ff"/>
  <text x="1014" y="232" text-anchor="middle" style="fill:#4f46e5;font-size:11px;font-weight:700">Work</text>
  <circle cx="1056" cy="228" r="4.5" fill="#f59e0b"/>
  <text x="1066" y="232" style="fill:#b45309;font-size:11px;font-weight:700">High</text>
  <rect x="988" y="248" width="184" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="988" y="264" width="150" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="988" y="278" width="120" height="7" rx="3.5" fill="#e2e8f0"/>
  <!-- push channel glyphs -->
  <g transform="translate(1150 270) scale(0.9)" fill="#26A5E4"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></g>
  <!-- ping ripple -->
  <circle cx="1180" cy="206" r="6" fill="none" stroke="#38bdf8" stroke-width="2">
    <animate attributeName="r" values="6;16;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1180" cy="206" r="4" fill="#38bdf8"/>

  <!-- footer strip -->
  <g transform="translate(64 360)">
    <g transform="translate(0 -12) scale(0.9)" fill="#00ADD8"><path d="M1.811 10.231c-.047 0-.058-.023-.035-.059l.246-.315c.023-.035.081-.058.128-.058h4.172c.046 0 .058.035.035.07l-.199.303c-.023.036-.082.07-.117.07zM.047 11.306c-.047 0-.059-.023-.035-.058l.245-.316c.023-.035.082-.058.129-.058h5.328c.047 0 .07.035.058.07l-.093.28c-.012.047-.058.07-.105.07zm2.828 1.075c-.047 0-.059-.035-.035-.07l.163-.292c.023-.035.07-.07.117-.07h2.337c.047 0 .07.035.07.082l-.023.28c0 .047-.047.082-.082.082zm12.129-2.36c-.736.187-1.239.327-1.963.514-.176.046-.187.058-.34-.117-.174-.199-.303-.327-.548-.444-.737-.362-1.45-.257-2.115.175-.795.514-1.204 1.274-1.192 2.22.011.935.654 1.706 1.577 1.835.795.105 1.46-.175 1.987-.77.105-.13.198-.27.315-.434H10.47c-.245 0-.304-.152-.222-.35.152-.362.432-.97.596-1.274a.315.315 0 01.292-.187h4.253c-.023.316-.023.631-.07.947a4.983 4.983 0 01-.958 2.29c-.841 1.11-1.94 1.8-3.33 1.986-1.145.152-2.209-.07-3.143-.77-.865-.655-1.356-1.52-1.484-2.595-.152-1.274.222-2.419.993-3.424.83-1.086 1.928-1.776 3.272-2.02 1.098-.2 2.15-.07 3.096.571.62.41 1.063.97 1.356 1.648.07.105.023.164-.117.2m3.868 6.461c-1.064-.024-2.034-.328-2.852-1.029a3.665 3.665 0 01-1.262-2.255c-.21-1.32.152-2.489.947-3.529.853-1.122 1.881-1.706 3.272-1.95 1.192-.21 2.314-.095 3.33.595.923.63 1.496 1.484 1.648 2.605.198 1.578-.257 2.863-1.344 3.962-.771.783-1.718 1.273-2.805 1.495-.315.06-.63.07-.934.106zm2.78-4.72c-.011-.153-.011-.27-.034-.387-.21-1.157-1.274-1.81-2.384-1.554-1.087.245-1.788.935-2.045 2.033-.21.912.234 1.835 1.075 2.21.643.28 1.285.244 1.905-.07.923-.48 1.425-1.228 1.484-2.233z"/></g>
    <text x="34" y="0" class="foot">Single static binary · zero runtime deps</text>
    <text x="384" y="0" class="footA">codex → openai → ollama</text>
    <text x="620" y="0" class="foot">·  Bark · Telegram · ntfy · Webhook</text>
  </g>
</svg>
